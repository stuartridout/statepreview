<style>
/* The gate. Same tokens as the mock behind it (docs/DESIGN.md); light only. */
:root{--canvas:#EFEDF8;--card:#FFFFFF;--ink:#1B1838;--ink-2:#5E5B7A;--hairline:#E3E0F0;--accent:#5B45E4;--grad:linear-gradient(135deg,#6A3DF0,#3A63DF);--on-accent:#FFFFFF;--shadow:0 8px 24px rgba(27,24,56,.06);--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
/* Everything below is scoped to the gate so nothing leaks into the mock once it is revealed. */
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate .box{width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow)}
#gate .eyebrow{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 8px}
#gate .box h1{font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
#gate .box p{margin:0 0 20px;color:var(--ink-2)}
#gate label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:8px}
#gate input{width:100%;font:inherit;font-weight:500;min-height:56px;padding:0 16px;border:1px solid var(--hairline);border-radius:14px;background:var(--card);color:var(--ink)}
#gate input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
#gate button{margin-top:12px;width:100%;min-height:48px;font:inherit;font-weight:500;padding:0 24px;border:0;border-radius:14px;background:var(--grad);color:var(--on-accent);cursor:pointer;transition:transform .15s cubic-bezier(.2,.7,.2,1)}
#gate button:active:not(:disabled){transform:scale(.98)}
#gate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gate button:disabled{opacity:.6;cursor:wait}
#gate .err{color:var(--ink);font-size:13px;margin:12px 0 0;min-height:1.4em}
#gate .err a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
#content{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="form" autocomplete="off">
    <p class="eyebrow">State of Your AI</p>
    <h1>A private preview</h1>
    <p>This is the direction mock, shared by password. Enter the one you were given and the whole thing is behind it: the survey, the sponsor side and the report.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Open the preview</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="content"></div>
