<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EFEDF8">
<title>State of Your AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<style>
/* The gate. Same tokens as the mock behind it (docs/DESIGN.md); light only. */
:root{--canvas:#EFEDF8;--card:#FFFFFF;--ink:#1B1838;--ink-2:#5E5B7A;--hairline:#E3E0F0;--accent:#5B45E4;--grad:linear-gradient(135deg,#6A3DF0,#3A63DF);--on-accent:#FFFFFF;--shadow:0 8px 24px rgba(27,24,56,.06);--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:440px;background:var(--card);border-radius:20px;padding:32px 24px;box-shadow:var(--shadow)}
.eyebrow{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 8px}
.box h1{font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.box p{margin:0 0 20px;color:var(--ink-2)}
label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:8px}
input{width:100%;font:inherit;font-weight:500;min-height:56px;padding:0 16px;border:1px solid var(--hairline);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button{margin-top:12px;width:100%;min-height:48px;font:inherit;font-weight:500;padding:0 24px;border:0;border-radius:14px;background:var(--grad);color:var(--on-accent);cursor:pointer;transition:transform .15s cubic-bezier(.2,.7,.2,1)}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--ink);font-size:13px;margin:12px 0 0;min-height:1.4em}
#content{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="form" autocomplete="off">
    <p class="eyebrow">State of Your AI</p>
    <h1>A private preview</h1>
    <p>This is the direction mock, shared by password. Enter the one you were given and the whole thing is behind it: the survey, the sponsor side and the report.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Open the preview</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="content"></div>

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  async function decrypt(password){
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
